name: Тесты и сборка сервисов

on:
  push:
  pull_request:

jobs:
  service:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: checkout
            dir: apps/checkout
          - name: payment
            dir: apps/payment
          - name: healer
            dir: healer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить тесты
        working-directory: ${{ matrix.dir }}
        run: |
          pip install -r requirements.txt
          pytest -q
      - name: Собрать образ
        run: docker build -t ${{ matrix.name }}:ci ${{ matrix.dir }}

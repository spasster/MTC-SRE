- name: Получить сведения об установленных пакетах
  ansible.builtin.package_facts:
    manager: auto

- name: Установить rsyslog и auditd
  ansible.builtin.apt:
    name:
      - rsyslog
      - auditd
    state: present
    update_cache: "{{ 'rsyslog' not in ansible_facts.packages or 'auditd' not in ansible_facts.packages }}"

- name: Включить rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: started
    enabled: true

- name: Создать файл до загрузки правила наблюдения
  ansible.builtin.copy:
    content: "mtc-sre\n"
    dest: /etc/mtc-sre-audit-marker
    mode: "0644"
    force: false

- name: Установить правило проекта без удаления чужих правил
  ansible.builtin.copy:
    src: audit.rules
    dest: /etc/audit/rules.d/mtc.rules
    mode: "0640"

- name: Включить auditd
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true

- name: Загрузить правила auditd
  ansible.builtin.command: augenrules --load
  changed_when: false

- name: Записать контрольное событие в syslog
  ansible.builtin.command: logger -t mtc-sre "Сбор системных журналов настроен"
  changed_when: false

- name: Записать контрольное событие auditd
  ansible.builtin.command: touch /etc/mtc-sre-audit-marker
  changed_when: false

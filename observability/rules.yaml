apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: checkout
  namespace: obs
  labels:
    release: kube-prom
spec:
  groups:
    - name: checkout.slo
      rules:
        - alert: CheckoutSyntheticFailed
          expr: probe_success{service="checkout"} == 0
          for: 30s
          labels:
            service: checkout
            severity: critical
          annotations:
            summary: Синтетический запрос checkout не прошёл
            description: "GET /work проверяет Redis, payment, HTTP 200 и тело ответа. Проверка не проходит 30 секунд."
            resolved: Синтетический запрос checkout снова успешен
            runbook_url: docs/runbooks/checkout-synthetic.md
        - alert: CheckoutSyntheticMissing
          expr: absent_over_time(probe_success{service="checkout"}[2m]) == 1
          for: 1m
          labels:
            service: checkout
            severity: critical
          annotations:
            summary: Нет данных синтетической проверки checkout
            description: "Нет probe_success две минуты. Проверить Blackbox и его ServiceMonitor; отсутствие данных не означает доступность."
            resolved: Данные синтетической проверки появились
            runbook_url: docs/runbooks/checkout-synthetic.md
        - alert: CheckoutHighErrorRate
          expr: |
            (
              sum(rate(http_requests_total{job="checkout",path="/work",status=~"5.."}[1m]))
              /
              sum(rate(http_requests_total{job="checkout",path="/work"}[1m]))
            ) > 0.005
          for: 30s
          labels:
            service: checkout
            severity: warning
          annotations:
            summary: У checkout ошибки
            description: "Доля 5xx за окно 1 минута выше 0.5% и держится 30 секунд. Проверить причину и допустимое действие по runbook."
            resolved: Checkout снова без лишних 5xx
            runbook_url: docs/runbooks/checkout-high-error-rate.md
        - alert: CheckoutSlow
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(http_request_duration_seconds_bucket{job="checkout",path="/work"}[1m])
              )
            ) > 0.3
          for: 30s
          labels:
            service: checkout
            severity: warning
          annotations:
            summary: Checkout тормозит
            description: "p95 за окно 1 минута выше 300 мс и держится 30 секунд. Сравнить задержку и CPU throttle подов."
            resolved: Checkout снова быстрее 300 мс
            runbook_url: docs/runbooks/checkout-slow.md

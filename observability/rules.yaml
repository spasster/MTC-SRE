apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: checkout
  namespace: obs
  labels:
    release: kube-prom
spec:
  groups:
    - name: checkout.slo
      rules:
        - alert: CheckoutHighErrorRate
          expr: |
            (
              sum(rate(http_requests_total{job="checkout",path="/work",status=~"5.."}[1m]))
              /
              sum(rate(http_requests_total{job="checkout",path="/work"}[1m]))
            ) > 0.005
          for: 30s
          labels:
            service: checkout
            severity: warning
          annotations:
            summary: У checkout ошибки
            description: "5xx на GET /work выше 0.5% уже минуту. Дальше либо спрошу approve, либо напишу, что сам не починю."
            resolved: Checkout снова без лишних 5xx
            runbook_url: docs/runbooks/checkout-high-error-rate.md
        - alert: CheckoutSlow
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(http_request_duration_seconds_bucket{job="checkout",path="/work"}[1m])
              )
            ) > 0.3
          for: 30s
          labels:
            service: checkout
            severity: warning
          annotations:
            summary: Checkout тормозит
            description: "GET /work медленнее 300 мс уже минуту. Если удалю медленный под или сделаю scale, напишу отдельно."
            resolved: Checkout снова быстрее 300 мс
            runbook_url: docs/runbooks/checkout-slow.md

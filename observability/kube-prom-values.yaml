grafana:
  admin:
    existingSecret: grafana-admin
    userKey: username
    passwordKey: password
  sidecar:
    datasources:
      exemplarTraceIdDestinations:
        datasourceUid: tempo
        traceIdLabelName: trace_id
        urlDisplayLabel: Трейс
prometheus:
  prometheusSpec:
    evaluationInterval: 15s
    enableFeatures:
      - exemplar-storage
    exemplars:
      maxSize: 100000
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
alertmanager:
  alertmanagerSpec:
    secrets:
      - healer-webhook
  config:
    route:
      receiver: "null"
      group_by:
        - alertname
        - service
      group_wait: 10s
      group_interval: 15s
      repeat_interval: 1h
      routes:
        - receiver: telegram
          matchers:
            - service = "healer"
          group_wait: 10s
          repeat_interval: 10m
        - receiver: telegram
          matchers:
            - service = "checkout"
          group_wait: 10s
          repeat_interval: 30m
          continue: true
        - receiver: healer
          matchers:
            - service = "checkout"
          group_wait: 10s
          repeat_interval: 1m
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: "null"
      - name: healer
        webhook_configs:
          - url: http://healer.heal.svc:8080/webhook
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/healer-webhook/token
      - name: telegram

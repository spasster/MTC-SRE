apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-datasource
  namespace: obs
  labels:
    grafana_datasource: "1"
data:
  tempo-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Tempo
        type: tempo
        access: proxy
        uid: tempo
        url: http://tempo.obs.svc.cluster.local:3200
        jsonData:
          nodeGraph:
            enabled: true
          tracesToLogsV2:
            datasourceUid: loki
            filterByTraceID: false
            customQuery: true
            query: '{namespace="demo"} | json | trace_id="$${__trace.traceId}"'

apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: redis-slow
  namespace: demo
spec:
  action: delay
  mode: all
  selector:
    pods:
      demo:
        - POD_NAME
  # Задержка ответа выбранного Redis вызывает таймаут checkout через 3 секунды.
  # Новый под не входит в селектор по имени. Пробы kubelet идут от ноды.
  direction: to
  target:
    mode: all
    selector:
      namespaces:
        - demo
      labelSelectors:
        app: checkout
  delay:
    latency: 5s
    correlation: "0"
    jitter: 0ms
  duration: 15m

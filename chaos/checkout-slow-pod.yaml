apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: checkout-slow-pod
  namespace: demo
spec:
  action: delay
  mode: all
  selector:
    pods:
      demo:
        - POD_NAME
  # Замедляются два обращения выбранного checkout к Redis, без разрыва payment.
  # Задержка ниже таймаута Redis; пробы kubelet не затрагиваются.
  direction: to
  target:
    mode: all
    selector:
      namespaces: [demo]
      labelSelectors:
        app: redis
  delay:
    latency: 250ms
    correlation: "0"
    jitter: 0ms
  duration: 15m

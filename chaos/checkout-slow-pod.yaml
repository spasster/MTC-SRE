apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: checkout-slow-pod
  namespace: demo
spec:
  action: delay
  mode: all
  selector:
    pods:
      demo:
        - POD_NAME
  # Envoy обращается к IP подов payment. Пробы kubelet не попадают под задержку.
  direction: to
  target:
    mode: all
    selector:
      namespaces: [demo]
      labelSelectors:
        app: payment
  delay:
    latency: 500ms
    correlation: "0"
    jitter: 0ms
  duration: 15m

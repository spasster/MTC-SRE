apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: demo-strict
  namespace: demo
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: checkout-metrics
  namespace: demo
spec:
  selector:
    matchLabels:
      app: checkout
  mtls:
    mode: STRICT
  portLevelMtls:
    8081:
      mode: DISABLE
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: payment-metrics
  namespace: demo
spec:
  selector:
    matchLabels:
      app: payment
  mtls:
    mode: STRICT
  portLevelMtls:
    8081:
      mode: DISABLE

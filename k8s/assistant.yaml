apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-assistant
  namespace: heal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-assistant-journal
  namespace: heal
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [healer-state]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-assistant-journal
  namespace: heal
subjects:
  - kind: ServiceAccount
    name: sre-assistant
    namespace: heal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sre-assistant-journal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-assistant
  namespace: demo
rules:
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-assistant
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: sre-assistant
    namespace: heal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sre-assistant
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-assistant
  namespace: heal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sre-assistant
  template:
    metadata:
      labels:
        app: sre-assistant
    spec:
      serviceAccountName: sre-assistant
      containers:
        - name: assistant
          image: healer:dev
          imagePullPolicy: IfNotPresent
          command: [uvicorn, app.assistant:app, --host, "0.0.0.0", --port, "8082"]
          ports:
            - containerPort: 8082
          env:
            - name: HEALER_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: healer-webhook
                  key: token
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sre-assistant
  namespace: heal
spec:
  selector:
    app: sre-assistant
  ports:
    - name: http
      port: 8082
      targetPort: 8082

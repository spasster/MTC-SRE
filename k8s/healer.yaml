apiVersion: v1
kind: Namespace
metadata:
  name: heal
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: healer
  namespace: heal
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: healer-state
  namespace: heal
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: healer-leader
  namespace: heal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: healer-state
  namespace: heal
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["healer-state"]
    verbs: ["get", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["healer-leader"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: healer-state
  namespace: heal
subjects:
  - kind: ServiceAccount
    name: healer
    namespace: heal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: healer-state
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: healer
  namespace: demo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["checkout", "redis", "payment"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["checkout", "redis"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    resourceNames: ["k6-spike"]
    verbs: ["get"]
  - apiGroups: ["chaos-mesh.org"]
    resources: ["podchaos", "networkchaos", "stresschaos"]
    resourceNames: ["checkout-limited-pod", "checkout-limited-network", "checkout-limited-cpu"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: healer
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: healer
    namespace: heal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: healer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healer
  namespace: heal
  labels:
    app: healer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healer
  template:
    metadata:
      labels:
        app: healer
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: healer
      containers:
        - name: healer
          image: healer:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
            - containerPort: 8081
          env:
            - name: HEALER_STATE_BACKEND
              value: kubernetes
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: TARGET_NAMESPACE
              value: demo
            - name: HEALER_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: healer-webhook
                  key: token
            - name: PROMETHEUS_URL
              value: http://kube-prom-kube-prometheus-prometheus.obs.svc:9090
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram
                  key: token
                  optional: true
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: telegram
                  key: chat_id
                  optional: true
            - name: TELEGRAM_ALLOWED_USER_IDS
              valueFrom:
                secretKeyRef:
                  name: telegram
                  key: allowed_user_ids
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: healer
  namespace: heal
spec:
  selector:
    app: healer
  # Метрики собираются напрямую с каждого пода через отдельный Service.
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: healer-metrics
  namespace: heal
  labels:
    app: healer-metrics
spec:
  selector:
    app: healer
  ports:
    - name: metrics
      port: 8081
      targetPort: 8081
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: healer
  namespace: obs
  labels:
    release: kube-prom
spec:
  jobLabel: app
  namespaceSelector:
    matchNames: [heal]
  selector:
    matchLabels:
      app: healer-metrics
  endpoints:
    - port: metrics
      interval: 15s
      scrapeTimeout: 5s

apiVersion: v1
kind: Namespace
metadata:
  name: heal
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: healer
  namespace: heal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: healer
  namespace: demo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: healer
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: healer
    namespace: heal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: healer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healer
  namespace: heal
  labels:
    app: healer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healer
  template:
    metadata:
      labels:
        app: healer
    spec:
      serviceAccountName: healer
      containers:
        - name: healer
          image: healer:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: TARGET_NAMESPACE
              value: demo
            - name: COOLDOWN_SECONDS
              value: "300"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: healer
  namespace: heal
spec:
  selector:
    app: healer
  ports:
    - name: http
      port: 8080
      targetPort: 8080

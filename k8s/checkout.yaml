apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout
  namespace: demo
data:
  REDIS_URL: "redis://redis:6379/0"
  REDIS_SOCKET_TIMEOUT: "3"
  PAYMENT_URL: "http://payment/pay"
  PAYMENT_TIMEOUT: "3"
  CPU_ITERS: "40000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: demo
  labels:
    app: checkout
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: checkout
          image: checkout:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
            - containerPort: 8081
          env:
            - name: FAIL_RATE
              value: "0"
            - name: EXTRA_LATENCY_MS
              value: "0"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.obs.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAMESPACE
              value: demo
            - name: OTEL_BSP_SCHEDULE_DELAY
              value: "2000"
          envFrom:
            - configMapRef:
                name: checkout
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: demo
  labels:
    app: checkout
spec:
  selector:
    app: checkout
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: metrics
      port: 8081
      targetPort: 8081

apiVersion: batch/v1
kind: Job
metadata:
  name: k6-spike
  namespace: demo
  labels:
    app: k6-spike
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: k6-spike
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.57.0
          imagePullPolicy: IfNotPresent
          args: ["run", "/scripts/spike.js"]
          env:
            - name: BASE_URL
              value: http://checkout/work
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: scripts
          configMap:
            name: k6-scripts
